name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ====== Windows ======
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compute version & asset arch
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          case "${{ matrix.arch }}" in
            amd64) ASSET_ARCH="x64" ;;
            *)     ASSET_ARCH="${{ matrix.arch }}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_ARCH=$ASSET_ARCH" >> $GITHUB_ENV

      - name: Bump about.json version
        shell: bash
        run: |
          jq --arg v "$VERSION" '.version = $v' about.json > about.json.tmp && mv about.json.tmp about.json
          echo "about.json version bumped to $VERSION"

      - name: Download FFmpeg
        # Download static FFmpeg binaries from BtbN/FFmpeg-Builds.
        # The archive contains bin/ffmpeg.exe and bin/ffprobe.exe.
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            amd64) FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" ;;
            arm64) FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl.zip" ;;
          esac
          curl -L "$FFMPEG_URL" -o /tmp/ffmpeg.zip
          mkdir -p /tmp/ffmpeg_extract
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg_extract >/dev/null
          FFMPEG_BIN=$(find /tmp/ffmpeg_extract -name ffmpeg.exe -path '*/bin/*' | head -1)
          FFPROBE_BIN=$(find /tmp/ffmpeg_extract -name ffprobe.exe -path '*/bin/*' | head -1)
          mkdir -p build/bin
          cp "$FFMPEG_BIN" build/bin/ffmpeg.exe
          cp "$FFPROBE_BIN" build/bin/ffprobe.exe
          echo "FFmpeg downloaded: $(ls -la build/bin/ffmpeg.exe build/bin/ffprobe.exe)"

      - name: Build
        shell: bash
        run: |
          wails build -nopackage -platform windows/${{ matrix.arch }} -o fforge.exe
          if [ -f "build/bin/fforge-${{ matrix.arch }}.exe" ] && [ ! -f "build/bin/fforge.exe" ]; then
            mv "build/bin/fforge-${{ matrix.arch }}.exe" "build/bin/fforge.exe"
          fi

      - name: Assemble release assets
        # Bare .exe for self-update; zip with bundled ffmpeg for initial install.
        shell: bash
        run: |
          ASSET_NAME="fforge-${VERSION}-windows-${ASSET_ARCH}.exe"
          cp build/bin/fforge.exe "build/bin/${ASSET_NAME}"
          ZIP_NAME="fforge-${VERSION}-windows-${ASSET_ARCH}.zip"
          cd build/bin && 7z a "$ZIP_NAME" fforge.exe ffmpeg.exe ffprobe.exe
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload .exe (self-update)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: build/bin/${{ env.ASSET_NAME }}

      - name: Upload .zip (install bundle)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: build/bin/${{ env.ZIP_NAME }}

  # ====== macOS ======
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compute version & asset arch
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          case "${{ matrix.arch }}" in
            amd64) ASSET_ARCH="x64" ;;
            *)     ASSET_ARCH="${{ matrix.arch }}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_ARCH=$ASSET_ARCH" >> $GITHUB_ENV

      - name: Bump about.json version
        shell: bash
        run: |
          jq --arg v "$VERSION" '.version = $v' about.json > about.json.tmp && mv about.json.tmp about.json
          echo "about.json version bumped to $VERSION"

      - name: Download FFmpeg
        # Download static FFmpeg binaries from osxexperts.net.
        # Each zip contains a single binary (ffmpeg or ffprobe).
        # NOTE: URLs are version-pinned and may drift — update periodically.
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            amd64)
              curl -L "https://www.osxexperts.net/ffmpeg80intel.zip" -o /tmp/ffmpeg.zip
              curl -L "https://www.osxexperts.net/ffprobe80intel.zip" -o /tmp/ffprobe.zip
              ;;
            arm64)
              curl -L "https://www.osxexperts.net/ffmpeg81arm.zip" -o /tmp/ffmpeg.zip
              curl -L "https://www.osxexperts.net/ffprobe81arm.zip" -o /tmp/ffprobe.zip
              ;;
          esac
          mkdir -p /tmp/ffmpeg_extract
          unzip -o /tmp/ffmpeg.zip -d /tmp/ffmpeg_extract >/dev/null
          unzip -o /tmp/ffprobe.zip -d /tmp/ffmpeg_extract >/dev/null
          FFMPEG_BIN=$(find /tmp/ffmpeg_extract -type f -name 'ffmpeg' | head -1)
          FFPROBE_BIN=$(find /tmp/ffmpeg_extract -type f -name 'ffprobe' | head -1)
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> $GITHUB_ENV
          echo "FFPROBE_BIN=$FFPROBE_BIN" >> $GITHUB_ENV
          echo "FFmpeg: $(ls -la "$FFMPEG_BIN" "$FFPROBE_BIN")"

      - name: Build .app
        run: wails build -platform darwin/${{ matrix.arch }} -o fforge

      - name: Copy FFmpeg into .app bundle
        # Place ffmpeg/ffprobe in Contents/Resources/ so the app resolves
        # them at runtime. The subsequent codesign --deep will sign them.
        run: |
          RES="build/bin/fforge.app/Contents/Resources"
          mkdir -p "$RES"
          cp "$FFMPEG_BIN" "$RES/ffmpeg"
          cp "$FFPROBE_BIN" "$RES/ffprobe"
          chmod +x "$RES/ffmpeg" "$RES/ffprobe"
          echo "Bundle resources:" && ls -la "$RES"

      - name: Ad-hoc sign .app
        run: |
          APP="build/bin/fforge.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=1 "$APP"

      - name: Create DMG
        # Build a drag-to-Applications DMG (standard macOS install UX) using
        # create-dmg. --app-drop-link synthesizes the Applications folder
        # shortcut on the right; a pure-white background PNG with install
        # hints is rendered via Pillow. The bottom security note shows the
        # xattr command to clear the quarantine block, since this open-source
        # release is unsigned and macOS Gatekeeper will flag it as "damaged".
        run: |
          brew install create-dmg
          # Generate a 660x400 pure-white background PNG with install hints
          # rendered via Pillow. Three text blocks, all visible without
          # resizing the window:
          #   1. title "fforge" (top, centered)
          #   2. drag hint (middle, above the app icon)
          #   3. security note (bottom): how to clear the quarantine block
          #      via xattr -cr, since this open-source release is unsigned.
          python3 -m venv /tmp/dmgvenv
          /tmp/dmgvenv/bin/pip install --quiet Pillow
          BG_PATH="build/bin/dmg_bg.png"
          export BG_PATH
          # Background image dimensions MUST match create-dmg --window-size:
          # Finder shows only the window-size region of the background.
          /tmp/dmgvenv/bin/python << 'PYEOF'
          import os
          from PIL import Image, ImageDraw, ImageFont
          w, h = 660, 400
          img = Image.new("RGBA", (w, h), (255, 255, 255, 255))
          draw = ImageDraw.Draw(img)
          def load_font(size):
              for path in [
                  "/System/Library/Fonts/PingFang.ttc",
                  "/System/Library/Fonts/Helvetica.ttc",
                  "/System/Library/Fonts/Supplemental/Arial.ttf",
              ]:
                  try:
                      return ImageFont.truetype(path, size)
                  except Exception:
                      pass
              return ImageFont.load_default()
          title_font = load_font(24)
          hint_font = load_font(14)
          small_font = load_font(12)
          cx = w / 2
          draw.text((cx, 40), "fforge", fill=(30, 30, 46, 255),
                    font=title_font, anchor="mm")
          draw.text((cx, 130), "Drag the app icon to the Applications folder on the right",
                    fill=(90, 90, 90, 255), font=hint_font, anchor="mm")
          draw.text((cx, 300),
                    'If macOS says "damaged", open Terminal and run:',
                    fill=(120, 120, 120, 255), font=small_font, anchor="mm")
          draw.text((cx, 330),
                    'xattr -cr "/Applications/fforge.app"',
                    fill=(40, 40, 40, 255), font=hint_font, anchor="mm")
          img.save(os.environ["BG_PATH"])
          PYEOF
          DMG_NAME="fforge-${VERSION}-macos-${ASSET_ARCH}.dmg"
          create-dmg \
            --volname "fforge" \
            --background "$BG_PATH" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --app-drop-link 480 200 \
            --icon "fforge.app" 180 200 \
            --no-internet-enable \
            "build/bin/${DMG_NAME}" \
            "build/bin/fforge.app" || true
          # create-dmg may fail on CI due to AppleScript; fallback to hdiutil
          if [ ! -f "build/bin/${DMG_NAME}" ]; then
            hdiutil create -volname "fforge" -srcfolder "build/bin/fforge.app" -ov -format UDZO "build/bin/${DMG_NAME}"
          fi
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Extract binary for self-update
        run: |
          BIN_NAME="fforge-${VERSION}-macos-${ASSET_ARCH}.bin"
          cp "build/bin/fforge.app/Contents/MacOS/fforge" "build/bin/${BIN_NAME}"
          echo "BIN_NAME=$BIN_NAME" >> $GITHUB_ENV

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: build/bin/${{ env.DMG_NAME }}

      - name: Upload update binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}
          path: build/bin/${{ env.BIN_NAME }}

  # ====== Linux ======
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            ruby ruby-dev
          sudo gem install fpm

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compute version & asset arch
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          case "${{ matrix.arch }}" in
            amd64) ASSET_ARCH="x64" ;;
            *)     ASSET_ARCH="${{ matrix.arch }}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_ARCH=$ASSET_ARCH" >> $GITHUB_ENV

      - name: Bump about.json version
        shell: bash
        run: |
          jq --arg v "$VERSION" '.version = $v' about.json > about.json.tmp && mv about.json.tmp about.json
          echo "about.json version bumped to $VERSION"

      - name: Download FFmpeg
        # Download static FFmpeg binaries from BtbN/FFmpeg-Builds.
        # The archive contains bin/ffmpeg and bin/ffprobe.
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            amd64) FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" ;;
            arm64) FFMPEG_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz" ;;
          esac
          curl -L "$FFMPEG_URL" -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg_extract
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg_extract
          FFMPEG_BIN=$(find /tmp/ffmpeg_extract -type f -name ffmpeg -path '*/bin/*' | head -1)
          FFPROBE_BIN=$(find /tmp/ffmpeg_extract -type f -name ffprobe -path '*/bin/*' | head -1)
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> $GITHUB_ENV
          echo "FFPROBE_BIN=$FFPROBE_BIN" >> $GITHUB_ENV
          echo "FFmpeg: $(ls -la "$FFMPEG_BIN" "$FFPROBE_BIN")"

      - name: Build
        run: |
          wails build -platform linux/${{ matrix.arch }} -o fforge
          if [ -f "build/bin/fforge-${{ matrix.arch }}" ] && [ ! -f "build/bin/fforge" ]; then
            mv "build/bin/fforge-${{ matrix.arch }}" "build/bin/fforge"
          fi
          ASSET_NAME="fforge-${VERSION}-linux-${ASSET_ARCH}"
          mv build/bin/fforge "build/bin/${ASSET_NAME}"
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV

      - name: Build .deb and .rpm packages
        env:
          DEB_ARCH: ${{ matrix.arch }}
          RPM_ARCH: ${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}
        run: |
          DEB_NAME="fforge-${VERSION}-linux-${ASSET_ARCH}.deb"
          RPM_NAME="fforge-${VERSION}-linux-${ASSET_ARCH}.rpm"
          STAGING="$(mktemp -d)"
          mkdir -p "$STAGING/share/applications"
          mkdir -p "$STAGING/lib/fforge"
          cat > "$STAGING/share/applications/fforge.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=fforge
          Comment=Cross-platform FFmpeg desktop GUI
          Exec=/usr/bin/fforge
          Icon=fforge
          Terminal=false
          Categories=AudioVideo;Video;
          DESKTOP
          cp "$FFMPEG_BIN" "$STAGING/lib/fforge/ffmpeg"
          cp "$FFPROBE_BIN" "$STAGING/lib/fforge/ffprobe"
          chmod +x "$STAGING/lib/fforge/ffmpeg" "$STAGING/lib/fforge/ffprobe"
          fpm -s dir -t deb \
            -n fforge -v "${VERSION}" -a "${DEB_ARCH}" \
            --depends libgtk-3-0 \
            --depends libwebkit2gtk-4.0-37 \
            --depends libayatana-appindicator3-1 \
            --depends librsvg2-2 \
            --description "fforge - FFmpeg desktop GUI" \
            -p "build/bin/${DEB_NAME}" \
            "build/bin/${ASSET_NAME}=/usr/bin/fforge" \
            "$STAGING/share/=/usr/share/" \
            "$STAGING/lib/=/usr/lib/"
          fpm -s dir -t rpm \
            -n fforge -v "${VERSION}" -a "${RPM_ARCH}" \
            --depends gtk3 \
            --depends webkit2gtk3 \
            --depends libayatana-appindicator3 \
            --depends librsvg2 \
            --description "fforge - FFmpeg desktop GUI" \
            -p "build/bin/${RPM_NAME}" \
            "build/bin/${ASSET_NAME}=/usr/bin/fforge" \
            "$STAGING/share/=/usr/share/" \
            "$STAGING/lib/=/usr/lib/"
          echo "DEB_NAME=$DEB_NAME" >> $GITHUB_ENV
          echo "RPM_NAME=$RPM_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: build/bin/${{ env.ASSET_NAME }}

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: build/bin/${{ env.DEB_NAME }}

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RPM_NAME }}
          path: build/bin/${{ env.RPM_NAME }}

  # ====== Release ======
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Generate sha256sums.txt
        shell: bash
        run: |
          set -eu
          cd staging
          sha256sum fforge-* > sha256sums.txt
          echo "---sha256sums.txt---"
          cat sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staging/fforge-*
            staging/sha256sums.txt
          draft: false
          generate_release_notes: true
