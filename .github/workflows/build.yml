name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ====== Windows ======
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compute version & asset arch
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          case "${{ matrix.arch }}" in
            amd64) ASSET_ARCH="x64" ;;
            *)     ASSET_ARCH="${{ matrix.arch }}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_ARCH=$ASSET_ARCH" >> $GITHUB_ENV

      - name: Bump about.json version
        shell: bash
        run: |
          jq --arg v "$VERSION" '.version = $v' about.json > about.json.tmp && mv about.json.tmp about.json
          echo "about.json version bumped to $VERSION"

      - name: Build
        shell: bash
        run: |
          wails build -nopackage -platform windows/${{ matrix.arch }} -o fforge.exe
          if [ -f "build/bin/fforge-${{ matrix.arch }}.exe" ] && [ ! -f "build/bin/fforge.exe" ]; then
            mv "build/bin/fforge-${{ matrix.arch }}.exe" "build/bin/fforge.exe"
          fi
          ASSET_NAME="fforge-${VERSION}-windows-${ASSET_ARCH}.exe"
          mv build/bin/fforge.exe "build/bin/${ASSET_NAME}"
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: build/bin/${{ env.ASSET_NAME }}

  # ====== macOS ======
  build-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compute version & asset arch
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          case "${{ matrix.arch }}" in
            amd64) ASSET_ARCH="x64" ;;
            *)     ASSET_ARCH="${{ matrix.arch }}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_ARCH=$ASSET_ARCH" >> $GITHUB_ENV

      - name: Bump about.json version
        shell: bash
        run: |
          jq --arg v "$VERSION" '.version = $v' about.json > about.json.tmp && mv about.json.tmp about.json
          echo "about.json version bumped to $VERSION"

      - name: Build .app
        run: wails build -platform darwin/${{ matrix.arch }} -o fforge

      - name: Ad-hoc sign .app
        run: |
          APP="build/bin/fforge.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose=1 "$APP"

      - name: Create DMG
        run: |
          brew install create-dmg
          DMG_NAME="fforge-${VERSION}-macos-${ASSET_ARCH}.dmg"
          create-dmg \
            --volname "fforge" \
            --window-pos 200 120 \
            --window-size 660 400 \
            --icon-size 100 \
            --app-drop-link 480 200 \
            --icon "fforge.app" 180 200 \
            --no-internet-enable \
            "build/bin/${DMG_NAME}" \
            "build/bin/fforge.app" || true
          # create-dmg may fail on CI due to AppleScript; fallback to hdiutil
          if [ ! -f "build/bin/${DMG_NAME}" ]; then
            hdiutil create -volname "fforge" -srcfolder "build/bin/fforge.app" -ov -format UDZO "build/bin/${DMG_NAME}"
          fi
          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Extract binary for self-update
        run: |
          BIN_NAME="fforge-${VERSION}-macos-${ASSET_ARCH}.bin"
          cp "build/bin/fforge.app/Contents/MacOS/fforge" "build/bin/${BIN_NAME}"
          echo "BIN_NAME=$BIN_NAME" >> $GITHUB_ENV

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: build/bin/${{ env.DMG_NAME }}

      - name: Upload update binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}
          path: build/bin/${{ env.BIN_NAME }}

  # ====== Linux ======
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            ruby ruby-dev
          sudo gem install fpm

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Compute version & asset arch
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="0.0.0-dev"
          fi
          case "${{ matrix.arch }}" in
            amd64) ASSET_ARCH="x64" ;;
            *)     ASSET_ARCH="${{ matrix.arch }}" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ASSET_ARCH=$ASSET_ARCH" >> $GITHUB_ENV

      - name: Bump about.json version
        shell: bash
        run: |
          jq --arg v "$VERSION" '.version = $v' about.json > about.json.tmp && mv about.json.tmp about.json
          echo "about.json version bumped to $VERSION"

      - name: Build
        run: |
          wails build -platform linux/${{ matrix.arch }} -o fforge
          if [ -f "build/bin/fforge-${{ matrix.arch }}" ] && [ ! -f "build/bin/fforge" ]; then
            mv "build/bin/fforge-${{ matrix.arch }}" "build/bin/fforge"
          fi
          ASSET_NAME="fforge-${VERSION}-linux-${ASSET_ARCH}"
          mv build/bin/fforge "build/bin/${ASSET_NAME}"
          echo "ASSET_NAME=$ASSET_NAME" >> $GITHUB_ENV

      - name: Build .deb and .rpm packages
        env:
          DEB_ARCH: ${{ matrix.arch }}
          RPM_ARCH: ${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}
        run: |
          DEB_NAME="fforge-${VERSION}-linux-${ASSET_ARCH}.deb"
          RPM_NAME="fforge-${VERSION}-linux-${ASSET_ARCH}.rpm"
          STAGING="$(mktemp -d)"
          mkdir -p "$STAGING/share/applications"
          cat > "$STAGING/share/applications/fforge.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=fforge
          Comment=Cross-platform FFmpeg desktop GUI
          Exec=/usr/bin/fforge
          Icon=fforge
          Terminal=false
          Categories=AudioVideo;Video;
          DESKTOP
          fpm -s dir -t deb \
            -n fforge -v "${VERSION}" -a "${DEB_ARCH}" \
            --depends libgtk-3-0 \
            --depends libwebkit2gtk-4.0-37 \
            --depends libayatana-appindicator3-1 \
            --depends librsvg2-2 \
            --description "fforge - FFmpeg desktop GUI" \
            -p "build/bin/${DEB_NAME}" \
            "build/bin/${ASSET_NAME}=/usr/bin/fforge" \
            "$STAGING/share/=/usr/share/"
          fpm -s dir -t rpm \
            -n fforge -v "${VERSION}" -a "${RPM_ARCH}" \
            --depends gtk3 \
            --depends webkit2gtk3 \
            --depends libayatana-appindicator3 \
            --depends librsvg2 \
            --description "fforge - FFmpeg desktop GUI" \
            -p "build/bin/${RPM_NAME}" \
            "build/bin/${ASSET_NAME}=/usr/bin/fforge" \
            "$STAGING/share/=/usr/share/"
          echo "DEB_NAME=$DEB_NAME" >> $GITHUB_ENV
          echo "RPM_NAME=$RPM_NAME" >> $GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: build/bin/${{ env.ASSET_NAME }}

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_NAME }}
          path: build/bin/${{ env.DEB_NAME }}

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RPM_NAME }}
          path: build/bin/${{ env.RPM_NAME }}

  # ====== Release ======
  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: staging
          merge-multiple: true

      - name: Generate sha256sums.txt
        shell: bash
        run: |
          set -eu
          cd staging
          sha256sum fforge-* > sha256sums.txt
          echo "---sha256sums.txt---"
          cat sha256sums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staging/fforge-*
            staging/sha256sums.txt
          draft: false
          generate_release_notes: true
